version: 1

service:
  results_socket: /run/rk-vision-service/results.sock
  control_socket: /run/rk-vision-service/control.sock
  log_dir: /userdata/rk-vision-service/logs
  stale_result_ms: 250
  rtsp_port: 8554

model:
  path: /userdata/rk-vision-service/models/yolov5s-640.rknn
  manifest: /userdata/rk-vision-service/models/yolov5s-640.yaml
  labels: /userdata/rk-vision-service/models/coco80.txt
  family: yolov5
  contexts: 2
  auto_select_cores: true
  confidence: 0.25
  nms_iou: 0.45
  max_detections: 100
  class_agnostic_nms: false
  class_filter: []

tracker:
  enabled: false

motion:
  enabled: false

display:
  enabled: false
  backend: wayland
  width: 1280
  height: 720
  fps: 1
  sources: []

sources:
  - id: cam0
    type: v4l2
    uri: /dev/video44
    enabled: true
    width: 3840
    height: 2160
    fps: 60
    buffers: 6
    detect_fps: 5
  - id: cam1
    type: v4l2
    uri: /dev/video62
    enabled: true
    width: 3840
    height: 2160
    fps: 60
    buffers: 6
    detect_fps: 5

outputs:
  - id: focus0
    kind: focus
    source: cam0
    codec: h264
    width: 1280
    height: 720
    fps: 60
    bitrate: 6000000
    gop: 60
    udp_enabled: false
    udp_host: 127.0.0.1
    udp_port: 5601
    rtsp_enabled: true
    rtsp_path: /focus/0
  - id: focus1
    kind: focus
    source: cam1
    codec: h264
    width: 1280
    height: 720
    fps: 60
    bitrate: 6000000
    gop: 60
    udp_enabled: false
    udp_host: 127.0.0.1
    udp_port: 5602
    rtsp_enabled: true
    rtsp_path: /focus/1
