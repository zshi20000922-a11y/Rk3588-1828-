server:
  host: 0.0.0.0
  port: 8080
  admin_token: SET_A_UNIQUE_TOKEN_BEFORE_START
  database: /userdata/rk-edge-ai/data/platform.db
  upload_dir: /userdata/rk-edge-ai/data/uploads
  kv_dir: /userdata/rk-edge-ai/data/kv
inference:
  backend: rknn3
  socket_path: /run/rk-edge-ai/inference.sock
  max_sessions: 4
  idle_swap_seconds: 900
  max_context_tokens: 1024
  compiled_kv_context_tokens: 1024
  max_new_tokens: 512
models:
  active: qwen2.5-omni-3b-rk1828
  registry:
    - {id: qwen2.5-omni-3b-rk1828, display_name: Qwen2.5-Omni-3B, target_device: rk1828, quantization: GRQ W4A16 / KV FP16, core_mask: '0xff', max_context_tokens: 1024, modalities: [text, image, audio]}
cameras:
  - {id: camera-1, name: 摄像头 1, provider: rtsp, source: 'rtsp://127.0.0.1:8554/focus/0'}
  - {id: camera-2, name: 摄像头 2, provider: rtsp, source: 'rtsp://127.0.0.1:8554/focus/1'}
  - {id: dual-view, name: 双摄拼接流, provider: rtsp, source: 'rtsp://127.0.0.1:8554/mosaic'}
  - {id: demo-global, name: 全局搜索相机, provider: rtsp, source: 'rtsp://127.0.0.1:8555/demo-global'}
  - {id: demo-roi, name: 高速 ROI 相机, provider: rtsp, source: 'rtsp://127.0.0.1:8555/demo-roi'}
  - {id: demo, name: Demo camera, provider: image, source: /userdata/rknn_Qwen2_5_Omni_demo/demo.jpg}
camera_preview:
  backend: ffmpeg
  width: 640
  height: 360
  fps: 5
  quality: 70
  latency_ms: 50
  idle_seconds: 2
plugins:
  - {id: rk3588-yolo, display_name: RK3588 YOLO detector, target_device: rk3588_npu, enabled: false, control_socket: /run/rk-vision-service/control.sock}
vision_service:
  enabled: true
  control_socket: /run/rk-vision-service/control.sock
  config_path: /userdata/rk-vision-service/config.yaml
dual_roi_demo:
  enabled: true
  control_socket: /run/rknn-dual-detector/control.sock
  detector_service: /etc/init.d/S95rknn-dual-detector
  vision_service: /etc/init.d/S96rk-vision-service
  start_timeout_seconds: 15
  validation_path: /userdata/rknn-dual-detector/config/homography_validation.json
  mapping_p95_limit_px: 160
  require_validation: true
